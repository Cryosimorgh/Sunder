name: G7 deterministic scene and P10 host contracts
on:
  push:
    branches:
      - g7-dense-dynamic-collision-workloads-20261102
  pull_request:
    paths:
      - 'g7_scenarios.py'
      - 'run_g7.py'
      - 'run_g7_windows.py'
      - 'test_g7_scenarios.py'
      - 'test_g7_infrastructure.py'
      - 'g7_visual_demo.py'
      - 'LAUNCH_G7_DEMO.cmd'
      - 'sunder_world.py'
      - '.github/workflows/g7-cpu-contracts.yml'
jobs:
  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU scene contract dependency
        run: python -m pip install numpy
      - name: Compile changed Python code (no D3D12 qualification)
        run: python -m py_compile g7_scenarios.py run_g7.py run_g7_windows.py test_g7_scenarios.py test_g7_infrastructure.py g7_visual_demo.py sunder_world.py
      - name: Deterministic scene and existing P10 host regression tests
        run: python -m unittest test_g7_scenarios test_g7_infrastructure test_sunder_world test_p10_packaging test_world_sweep -v
