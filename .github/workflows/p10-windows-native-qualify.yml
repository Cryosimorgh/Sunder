name: P10 Windows native qualification attempt
on:
  workflow_dispatch:
jobs:
  native-qualify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Install native test dependencies
        run: python -m pip install numpy
      - name: Stage native verification sources from test branch
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin test
          $paths = @(git ls-tree -r --name-only FETCH_HEAD) | Where-Object {
            $_ -match '^(test_[^/]+\.(?:py|cpp|c|zig)|tests\.zig|.*_tests\.zig|adversarial\.zig|dev_test\.py) (NO mock, NO --skip-stress)
        run: python run_world_sweep.py --full
      - name: Preserve original native evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-native-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/p10/world-sweep/
            evidence/p10/build/manifest.json
            evidence/p10/build/build-*.log
            dev-test-results/
          if-no-files-found: warn
          retention-days: 30

          }
          foreach ($path in $paths) {
            $source = git show "FETCH_HEAD:${path}"
            if ($LASTEXITCODE -ne 0) { throw "Missing test-branch source $path" }
            [System.IO.File]::WriteAllLines((Join-Path (Get-Location) $path), [string[]]$source)
          }
      - name: Full native qualification (NO mock, NO --skip-stress)
        run: python run_world_sweep.py --full
      - name: Preserve original native evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-native-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/p10/world-sweep/
            evidence/p10/build/manifest.json
            evidence/p10/build/build-*.log
            dev-test-results/
          if-no-files-found: warn
          retention-days: 30
