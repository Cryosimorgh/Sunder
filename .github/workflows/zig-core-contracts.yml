name: Zig core CPU contracts

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - main
    paths:
      - 'entity.zig'
      - 'transaction.zig'
      - 'storage.zig'
      - 'storage_device.zig'
      - 'reference_state.zig'
      - 'tests.zig'
      - '.github/workflows/zig-core-contracts.yml'

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Validate refactored source formatting
        run: |
          git ls-files '*.zig' | grep -v '^layout.zig
      - name: Validate storage and device Zig syntax
        run: for source in storage.zig storage_device.zig reference_state.zig; do zig ast-check "$source"; done
      - name: Stage test-only Zig contracts from test branch
        run: |
          git fetch --no-tags --depth=1 origin test
          git show FETCH_HEAD:tests.zig > tests.zig
      - name: Validate entity mapping, generation and transaction rollback
        run: zig test tests.zig -O ReleaseSafe
      - name: Stage reference regression from test branch without committing it to production
        run: |
          git show FETCH_HEAD:test_reference_state.zig > .test-reference.zig
      - name: Verify reference recurrence with test-branch contracts
        run: zig test .test-reference.zig -O ReleaseSafe
 | xargs -r zig fmt --check
